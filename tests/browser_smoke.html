<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Browser smoke test</title>
  <link rel="stylesheet" href="../styles.css?v=rakasta-fix">
</head>
<body>
  <pre id="smoke">PENDING</pre>
  <main>
    <input id="verbInput" value="antaa">
    <button id="conjugateBtn">Conjugate</button>
    <label><input type="radio" name="displayMode" value="strict" checked>Strict</label>
    <label><input type="radio" name="displayMode" value="reference">Reference</label>
    <button data-sample="jua">jua</button>
    <div id="output"></div>
  </main>
  <script src="../dictionary.js"></script>
  <script src="../grammar_rules.js"></script>
  <script src="../validation_metadata.js"></script>
  <script src="../lexicon.js"></script>
  <script src="../meanbot_update_data.js"></script>
  <script src="../meanbot_updates.js"></script>
  <script src="../past_example_data.js"></script>
  <script src="../past_examples.js?v=rakasta-fix"></script>
  <script src="../morphology.js?v=rakasta-fix"></script>
  <script src="../render.js?v=rakasta-fix"></script>
  <script src="../app.js"></script>
  <script>
    window.addEventListener("load", () => {
      const output = document.getElementById("output");
      const api = window.__conjugator;
      const wraps = output.querySelectorAll(".table-wrap");
      const firstHeader = output.querySelector("th:first-child");
      const checks = {
        debug_api: Boolean(api?.generateCell),
        tables: output.querySelectorAll("table").length === 2,
        present: output.textContent.includes("annan"),
        passive: output.textContent.includes("annethaan"),
        unsupported_visible: output.textContent.includes("Unsupported"),
        status_visible: output.textContent.includes("Verified"),
        dictionary: api.lookupDictionary("antaa").found,
        metadata: ["surfaces", "status", "source", "rule_id", "note"].every(key =>
          Object.hasOwn(api.generateCell("antaa", "finite|Present tense|mie"), key)
        ),
        variants: api.generateCell("antaa", "nonfinite|3rd infinitive illative|active").surfaces.length === 3,
        gradation: !api.conjugateParadigm("avata").nonfinite.some(row =>
          [row.active, row.passive].some(cell => cell.surfaces.includes("apannu"))
        ),
        jua_juua_distinct:
          api.generateCell("jua", "finite|Present tense|mie").surfaces[0] !==
          api.generateCell("juua", "finite|Present tense|mie").surfaces[0],
        saa_ambiguous: api.resolveInput("saa").kind === "ambiguous_known",
        potential_unsupported: api.generateCell("antaa", "finite|Potential tense|mie").status === "unsupported",
        table_scrollable: [...wraps].every(wrap => getComputedStyle(wrap).overflowX === "auto"),
        sticky_column_opaque:
          getComputedStyle(firstHeader).position === "sticky" &&
          getComputedStyle(firstHeader).backgroundColor !== "rgba(0, 0, 0, 0)"
      };
      document.querySelector('[data-sample="jua"]').click();
      checks.sample_button = document.getElementById("verbInput").value === "jua" && output.textContent.includes("juon");
      document.getElementById("verbInput").value = "tapahtua";
      document.getElementById("conjugateBtn").click();
      const heuristicCell = output.querySelector(".cell-status-heuristic");
      checks.default_shows_heuristic_surface = heuristicCell.querySelector(".cell-forms").textContent === "tapahtun";
      checks.heuristic_badge_separate = heuristicCell.querySelector(".cell-badge").textContent === "Heuristic";
      checks.empty_heuristic_is_unavailable = [...output.querySelectorAll(".cell-status-heuristic .cell-forms")].some(cell => cell.textContent === "Unavailable");
      checks.default_evidence_on_focus = heuristicCell.querySelector(".cell-result").title.includes("Rule:") && !heuristicCell.querySelector(".cell-evidence");
      const reference = document.querySelector('input[value="reference"]');
      reference.checked = true;
      reference.dispatchEvent(new Event("change", { bubbles: true }));
      checks.reference_labels_heuristic_surface = output.querySelector(".cell-status-heuristic .cell-forms").textContent === "tapahtun" && output.textContent.includes("Heuristic");
      checks.reference_evidence_visible = output.querySelector(".cell-evidence").textContent.includes("Source:");
      document.getElementById("verbInput").value = "antaa";
      document.getElementById("conjugateBtn").click();
      checks.partial_surface_visible = [...output.querySelectorAll(".cell-status-partial .cell-forms")].some(cell => cell.textContent === api.generateCell("antaa", "finite|Present perfect tense|mie").surfaces.join(" / "));
      document.querySelector('input[value="strict"]').checked = true;
      document.querySelector('input[value="strict"]').dispatchEvent(new Event("change", { bubbles: true }));
      checks.default_partial_surface_visible = [...output.querySelectorAll(".cell-status-partial .cell-forms")].some(cell => cell.textContent === api.generateCell("antaa", "finite|Present perfect tense|mie").surfaces.join(" / "));
      checks.unsupported_is_unavailable = output.querySelector(".cell-status-unsupported .cell-forms").textContent === "Unavailable";
      checks.updated_conditional_visible = [...output.querySelectorAll(".cell-status-derived .cell-forms")].some(cell => cell.textContent === "en antais");
      checks.updated_passive_visible = [...output.querySelectorAll(".cell-status-derived .cell-forms")].some(cell => cell.textContent === "ei antaa");
      checks.per_surface_source_visible = [...output.querySelectorAll(".cell-status-derived .cell-result")].some(cell => cell.title.includes("main-component-roundtrip") && cell.title.includes("VERB_RUNTIME_RESULTS.tsv:"));
      document.getElementById("verbInput").value = "olla";
      document.getElementById("conjugateBtn").click();
      const potential = [...output.querySelectorAll("tbody tr")].find(row => row.querySelector("td").textContent === "Potential tense");
      checks.exact_lienee_visible = potential.querySelectorAll("td")[3].querySelector(".cell-forms").textContent === "lienee";
      checks.neighboring_potential_unavailable = potential.querySelectorAll("td")[1].querySelector(".cell-forms").textContent === "Unavailable";
      document.getElementById("verbInput").value = "rakastaa";
      document.getElementById("conjugateBtn").click();
      const past = [...output.querySelectorAll("tbody tr")].find(row => row.querySelector("td").textContent === "Past tense");
      checks.document_example_visible = past.querySelectorAll("td")[3].querySelector(".cell-forms").textContent === "rakasti";
      checks.document_badge_distinct = past.querySelectorAll("td")[3].querySelector(".cell-badge").textContent === "Document example";
      checks.extrapolated_past_visible = past.querySelectorAll("td")[1].querySelector(".cell-forms").textContent === "rakastin";
      checks.extrapolated_badge_distinct = past.querySelectorAll("td")[1].querySelector(".cell-badge").textContent === "Heuristic";
      checks.document_source_locator = past.querySelectorAll("td")[3].querySelector(".cell-result").title.includes("#T5.R9");
      checks.document_composed_example_limit = past.querySelectorAll("td")[3].querySelector(".cell-result").title.includes("not an independent corpus attestation");
      checks.heldout_rule_candidate = api.generateCell("haista", "finite|Past tense|mie").surfaces[0] === "haisin" && api.generateCell("haista", "finite|Past tense|mie").status === "heuristic";
      checks.document_strong_stem_gap = api.generateCell("auttaa", "finite|Past tense|se/hään").surfaces.length === 0 && api.generateCell("auttaa", "finite|Past tense|se/hään").status === "ambiguous";
      document.getElementById("verbInput").value = "vanheta";
      document.getElementById("conjugateBtn").click();
      const auditedPast = [...output.querySelectorAll("tbody tr")].find(row => row.querySelector("td").textContent === "Past tense");
      checks.audited_past_retained = auditedPast.querySelectorAll("td")[3].querySelector(".cell-forms").textContent === "vanheni";
      checks.source_conflict_explained = auditedPast.querySelectorAll("td")[3].querySelector(".cell-result").title.includes("vanhentu");
      checks.source_conflict_not_variant = !auditedPast.querySelectorAll("td")[3].querySelector(".cell-forms").textContent.includes("vanhentu");
      checks.visible_variant_normalization = api.resolveInput("tehjä").lemma === "tehä" && api.resolveInput("tehjä").normalized_from === "tehjä";
      document.getElementById("verbInput").value = "rakasta";
      document.getElementById("conjugateBtn").click();
      const reportedPast = [...output.querySelectorAll("tbody tr")].find(row => row.querySelector("td").textContent === "Past tense");
      checks.reported_spelling_past = reportedPast.querySelectorAll("td")[3].querySelector(".cell-forms").textContent === "rakasti";
      checks.reported_spelling_document_badge = reportedPast.querySelectorAll("td")[3].querySelector(".cell-badge").textContent === "Document example";
      checks.reported_spelling_mie = reportedPast.querySelectorAll("td")[1].querySelector(".cell-forms").textContent === "rakastin";
      checks.reported_spelling_no_rakasi = ![...reportedPast.querySelectorAll(".cell-forms")].some(cell => /^(rakasi|rakasin)$/.test(cell.textContent));
      checks.variant_target_visible = output.textContent.includes("Forms shown for") && output.textContent.includes("showing the documented rakastaa forms");
      checks.original_region_retained = output.textContent.includes("rakasta (Kie)") && output.textContent.includes("Part of speech: Kie, v");
      checks.reported_spelling_participle = api.generateCell("rakasta", "nonfinite|Past participle|active").surfaces[0] === "rakastanu";
      checks.unsupported_variant_not_guessed = api.generateCell("halkasta", "finite|Past tense|se/hään").surfaces.length === 0;
      const reportedWrap = output.querySelector(".table-wrap");
      reportedWrap.scrollLeft = 150;
      checks.sticky_body_column_opaque = [...output.querySelectorAll("tbody td:first-child")].every(cell => getComputedStyle(cell).position === "sticky" && /^rgb\(/.test(getComputedStyle(cell).backgroundColor));
      const passed = Object.values(checks).every(Boolean);
      document.getElementById("smoke").textContent = JSON.stringify({ passed, checks });
      document.body.dataset.smoke = passed ? "pass" : "fail";
    });
  </script>
</body>
</html>
