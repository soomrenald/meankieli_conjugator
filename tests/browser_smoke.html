<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Browser smoke test</title>
  <link rel="stylesheet" href="../styles.css">
</head>
<body>
  <pre id="smoke">PENDING</pre>
  <main>
    <input id="verbInput" value="antaa">
    <button id="conjugateBtn">Conjugate</button>
    <label><input type="radio" name="displayMode" value="strict" checked>Strict</label>
    <label><input type="radio" name="displayMode" value="reference">Reference</label>
    <button data-sample="jua">jua</button>
    <div id="output"></div>
  </main>
  <script src="../dictionary.js"></script>
  <script src="../grammar_rules.js"></script>
  <script src="../validation_metadata.js"></script>
  <script src="../lexicon.js"></script>
  <script src="../morphology.js"></script>
  <script src="../render.js"></script>
  <script src="../app.js"></script>
  <script>
    window.addEventListener("load", () => {
      const output = document.getElementById("output");
      const api = window.__conjugator;
      const wraps = output.querySelectorAll(".table-wrap");
      const firstHeader = output.querySelector("th:first-child");
      const checks = {
        debug_api: Boolean(api?.generateCell),
        tables: output.querySelectorAll("table").length === 2,
        present: output.textContent.includes("annan"),
        passive: output.textContent.includes("annethaan"),
        unsupported_visible: output.textContent.includes("Unsupported"),
        status_visible: output.textContent.includes("Verified"),
        dictionary: api.lookupDictionary("antaa").found,
        metadata: ["surfaces", "status", "source", "rule_id", "note"].every(key =>
          Object.hasOwn(api.generateCell("antaa", "finite|Present tense|mie"), key)
        ),
        variants: api.generateCell("antaa", "nonfinite|3rd infinitive illative|active").surfaces.length === 3,
        gradation: !api.conjugateParadigm("avata").nonfinite.some(row =>
          [row.active, row.passive].some(cell => cell.surfaces.includes("apannu"))
        ),
        jua_juua_distinct:
          api.generateCell("jua", "finite|Present tense|mie").surfaces[0] !==
          api.generateCell("juua", "finite|Present tense|mie").surfaces[0],
        saa_ambiguous: api.resolveInput("saa").kind === "ambiguous_known",
        potential_unsupported: api.generateCell("antaa", "finite|Potential tense|mie").status === "unsupported",
        table_scrollable: [...wraps].every(wrap => getComputedStyle(wrap).overflowX === "auto"),
        sticky_column_opaque:
          getComputedStyle(firstHeader).position === "sticky" &&
          getComputedStyle(firstHeader).backgroundColor !== "rgba(0, 0, 0, 0)"
      };
      document.querySelector('[data-sample="jua"]').click();
      checks.sample_button = document.getElementById("verbInput").value === "jua" && output.textContent.includes("juon");
      document.getElementById("verbInput").value = "tapahtua";
      document.getElementById("conjugateBtn").click();
      const heuristicCell = output.querySelector(".cell-status-heuristic");
      checks.default_shows_heuristic_surface = heuristicCell.querySelector(".cell-forms").textContent === "tapahtun";
      checks.heuristic_badge_separate = heuristicCell.querySelector(".cell-badge").textContent === "Heuristic";
      checks.empty_heuristic_is_unavailable = [...output.querySelectorAll(".cell-status-heuristic .cell-forms")].some(cell => cell.textContent === "Unavailable");
      checks.default_evidence_on_focus = heuristicCell.querySelector(".cell-result").title.includes("Rule:") && !heuristicCell.querySelector(".cell-evidence");
      const reference = document.querySelector('input[value="reference"]');
      reference.checked = true;
      reference.dispatchEvent(new Event("change", { bubbles: true }));
      checks.reference_labels_heuristic_surface = output.querySelector(".cell-status-heuristic .cell-forms").textContent === "tapahtun" && output.textContent.includes("Heuristic");
      checks.reference_evidence_visible = output.querySelector(".cell-evidence").textContent.includes("Source:");
      document.getElementById("verbInput").value = "antaa";
      document.getElementById("conjugateBtn").click();
      checks.partial_surface_visible = [...output.querySelectorAll(".cell-status-partial .cell-forms")].some(cell => cell.textContent === api.generateCell("antaa", "finite|Present negative tense|passive").surfaces.join(" / "));
      document.querySelector('input[value="strict"]').checked = true;
      document.querySelector('input[value="strict"]').dispatchEvent(new Event("change", { bubbles: true }));
      checks.default_partial_surface_visible = [...output.querySelectorAll(".cell-status-partial .cell-forms")].some(cell => cell.textContent === api.generateCell("antaa", "finite|Present negative tense|passive").surfaces.join(" / "));
      checks.unsupported_is_unavailable = output.querySelector(".cell-status-unsupported .cell-forms").textContent === "Unavailable";
      const passed = Object.values(checks).every(Boolean);
      document.getElementById("smoke").textContent = JSON.stringify({ passed, checks });
      document.body.dataset.smoke = passed ? "pass" : "fail";
    });
  </script>
</body>
</html>
